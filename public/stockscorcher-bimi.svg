        letter-spacing="8" fill="#ffffff">LEARN | AMALYZE | GROW</text>

  <!-- simple ascending bars -->
  <g>
    <rect x="455" y="910" width="28" height="45" fill="#ff4a00"/>
    <rect x="490" y="890" width="28" height="65" fill="#ff8a00"/>
    <rect x="525" y="865" width="28" height="90" fill="#ffd000"/>
    <rect x="560" y="885" width="28" height="70" fill="#59ff00"/>
    <rect x="595" y="875" width="28" height="80" fill="#7cff00"/>
