    <rect x="640" y="465" width="20" height="100"/>
    <rect x="670" y="425" width="20" height="140"/>
    <rect x="700" y="375" width="20" height="190"/>
  </g>
  <path d="M600 570 C665 530 710 470 770 370" fill="none"
