  <path d="M750 380 L775 345 L805 365 L780 400 Z" fill="#59ff00"/>

  <!-- wordmark -->
  <text x="500" y="715" text-anchor="middle"
        font-family="Arial, Helvetica, sans-serif" font-size="72"
        font-weight="700" letter-spacing="2" fill="#f2f2f2">STOCK<tspan fill="#ff4a00">SCORCHER</tspan></text>

  <path d="M170 755 H420" stroke="#ff3b00" stroke-width="7"/>
  <path d="M580 755 H830" stroke="#59ff00" stroke-width="7"/>

  <!-- bull mark -->
  <path d="M470 785 C450 770 430 780 420 795 C440 795 450 810 470 808
           C490 806 505 790 520 792 C535 795 548 785 540 777
           C525 783 515 775 505 770 C495 765 485 775 470 785Z"
