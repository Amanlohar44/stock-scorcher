<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink"
     width="1000" height="1000" viewBox="0 0 1000 1000" version="1.2"
     baseProfile="tiny-ps">
  <title>Stock Scorcher</title>
  <desc>Stock Scorcher brand logo</desc>
  <rect width="1000" height="1000" fill="#000000"/>
  <circle cx="500" cy="500" r="470" fill="#000000" stroke="#ff3b00" stroke-width="18"/>
  <circle cx="500" cy="500" r="461" fill="none" stroke="#7cff00" stroke-width="7" opacity=".85"/>

  <!-- stylized flame -->
  <path d="M155 500 C105 420 175 390 205 320 C225 375 275 340 275 270
           C330 345 315 420 270 485 C245 520 205 535 155 500Z"
        fill="#ff2600"/>
  <path d="M175 475 C150 425 205 400 225 350 C240 395 265 385 260 335
           C295 390 275 440 245 480 C225 505 195 500 175 475Z"
        fill="#ff9d00"/>

  <!-- S -->
  <path d="M270 315 L560 315 L525 385 L355 385
           C320 385 315 420 350 425 L485 442
           C565 452 575 535 500 590
           C475 608 445 615 405 615 L210 615 L250 545 L425 545
           C458 545 465 510 430 505 L300 490
           C215 480 205 395 270 315Z"
